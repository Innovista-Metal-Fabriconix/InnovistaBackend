name: Deploy Backend to EC2

on:
  push:
    branches:
      - Deployment_Product


jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: production


    steps:


      - name: Checkout Repository
        uses: actions/checkout@v4



      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json



      - name: Install Dependencies

        run: |
          npm ci --legacy-peer-deps



      - name: Generate Prisma Client

        run: |
          npx prisma generate



      - name: Build NestJS Application

        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: production

        run: |
          npm run build



      - name: Verify Build

        run: |

          echo "Checking build output"

          ls -la dist


          if [ -f dist/src/main.js ]; then

            echo "Found dist/src/main.js"


          elif [ -f dist/main.js ]; then

            echo "Found dist/main.js"


          else

            echo "Build failed"

            exit 1

          fi





      - name: Copy Build Files To EC2

        uses: appleboy/scp-action@v0.1.7


        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}


          source: |
            dist
            package.json
            package-lock.json
            prisma


          target: ${{ secrets.EC2_PATH }}

          overwrite: true





      - name: Deploy Application On EC2

        uses: appleboy/ssh-action@v1.2.0


        env:

          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}


        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}

          envs: ENV_FILE_CONTENT



          script: |

            set -e



            echo "================================"

            echo "Starting EC2 Deployment"

            echo "================================"



            cd "${{ secrets.EC2_PATH }}"



            echo "Creating Environment File"


            printf "%s" "$ENV_FILE_CONTENT" > .env




            echo "Installing Production Dependencies"


            npm ci --omit=dev --legacy-peer-deps




            echo "Generating Prisma Client"


            npx prisma generate




            echo "Running Prisma Migration"


            npx prisma migrate deploy




            echo "Checking Application File"



            if [ -f dist/src/main.js ]; then


              APP_FILE="dist/src/main.js"



            elif [ -f dist/main.js ]; then


              APP_FILE="dist/main.js"



            else


              echo "Application file not found"


              echo "Current directory:"


              pwd


              echo "Files:"


              ls -la


              echo "Dist:"


              ls -R dist || true


              exit 1


            fi




            echo "Starting Application: $APP_FILE"




            if pm2 describe innovista-backend > /dev/null 2>&1

            then

              echo "Restarting PM2"

              pm2 restart innovista-backend


            else

              echo "Starting PM2"

              pm2 start "$APP_FILE" \
                --name innovista-backend


            fi




            pm2 save



            echo "================================"

            echo "Deployment Completed Successfully"

            echo "================================"