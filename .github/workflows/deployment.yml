name: Deploy to EC2 Instances

on:
  push:
    branches:
      - Deployment_Product

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: back-end
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: back-end
        run: npx prisma generate

      - name: Build NestJS
        working-directory: back-end
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "back-end/dist,back-end/package.json,back-end/package-lock.json,back-end/prisma"
          target: "${{ secrets.EC2_PATH }}/back-end"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE_CONTENT
          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd ${{ secrets.EC2_PATH }}/back-end

            echo "🔐 Creating .env"
            printf "%s" "$ENV_FILE_CONTENT" > .env

            echo "📦 Installing dependencies"
            npm install --legacy-peer-deps

            echo "🛠️ Running migrations"
            npx prisma migrate deploy

            echo "🔍 Verifying build"
            find dist -name main.js

            echo "Restarting PM2"
            pm2 delete innovista-backend || true
            pm2 start dist/src/main.js \
              --name innovista-backend \
              --node-args="--max-old-space-size=1024"

            pm2 save

            echo "Deployment successful"
