name: Deploy Backend to EC2

on:
  push:
    branches:
      - Deployment_Product


jobs:

  deploy:

    runs-on: ubuntu-latest

    environment: production


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json



      - name: Install dependencies

        working-directory: back-end

        run: npm ci --legacy-peer-deps



      - name: Generate Prisma Client

        working-directory: back-end

        run: npx prisma generate



      - name: Build NestJS Application

        working-directory: back-end

        env:

          NODE_OPTIONS: --max-old-space-size=4096

          NODE_ENV: production

        run: npm run build



      - name: Verify Build

        working-directory: back-end

        run: |

          echo "Checking build output"

          ls -la dist


          if [ -f dist/src/main.js ] || [ -f dist/main.js ]

          then

            echo "Build successful"

          else

            echo "main.js not found"

            exit 1

          fi




      - name: Copy Build Files To EC2

        uses: appleboy/scp-action@v0.1.7

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}


          source: "back-end/dist,back-end/package.json,back-end/package-lock.json,back-end/prisma"


          target: ${{ secrets.EC2_PATH }}

          overwrite: true





      - name: Deploy Application

        uses: appleboy/ssh-action@v1.2.0


        env:

          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}


        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}

          envs: ENV_FILE_CONTENT



          script: |

            set -e



            cd "${{ secrets.EC2_PATH }}"



            echo "Creating .env"

            printf "%s" "$ENV_FILE_CONTENT" > .env




            echo "Installing production dependencies"

            npm ci --omit=dev --legacy-peer-deps




            echo "Generating Prisma Client"

            npx prisma generate




            echo "Running migrations"

            npx prisma migrate deploy




            if [ -f dist/src/main.js ]

            then

              APP_FILE="dist/src/main.js"

            else

              APP_FILE="dist/main.js"

            fi




            echo "Starting application"



            if pm2 describe innovista-backend > /dev/null 2>&1

            then

              pm2 restart innovista-backend

            else

              pm2 start "$APP_FILE" --name innovista-backend

            fi




            pm2 save



            echo "Deployment completed successfully"