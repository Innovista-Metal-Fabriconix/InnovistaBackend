name: Deploy to EC2 Instances

on:
  push:
    branches:
      - Deployment_Product

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: NODE_OPTIONS="--max-old-space-size=2048" npm run build

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist,package.json,package-lock.json,prisma"
          target: ${{ secrets.EC2_PATH }}/back-end

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE_CONTENT
          script: |
            set -e

            cd ${{ secrets.EC2_PATH }}/back-end

            echo "🔐 Creating .env file..."
            printf "%s" "$ENV_FILE_CONTENT" > .env

            echo "📦 Installing production dependencies only..."
            npm install --production --legacy-peer-deps

            echo "⚙️ Running Prisma migrate..."
            npx prisma migrate deploy

            echo "🔄 Restarting PM2..."
            pm2 restart innovista-backend || pm2 start dist/src/main.js --name innovista-backend
            pm2 save

            echo "🎉 Deployment successful!"