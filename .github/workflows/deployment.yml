name: Deploy to EC2 Instances

on:
  push:
    branches:
      - Deployment_Product

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back-end

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      # 3. Install dependencies (BUILD ON GITHUB, NOT EC2)
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4. Build project (FIX MEMORY ISSUE)
      - name: Build project
        run: NODE_OPTIONS="--max-old-space-size=2048" npm run build

      # 5. Copy build to EC2
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist,package.json,package-lock.json,prisma"
          target: "${{ secrets.EC2_PATH }}/back-end"

      # 6. Deploy on EC2 (ONLY RUN, NO BUILD)
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE_CONTENT
          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd ${{ secrets.EC2_PATH }}/back-end

            # Create env file
            echo "🔐 Creating .env file..."
            printf "%s" "$ENV_FILE_CONTENT" > .env

            # Install ONLY production deps
            echo "📦 Installing production dependencies..."
            npm install --production --legacy-peer-deps

            # Prisma migrations
            echo "🛠️ Running Prisma migrations..."
            npx prisma migrate deploy

            # Restart PM2
            echo "🔄 Restarting application..."
            pm2 restart innovista-backend || pm2 start dist/src/main.js --name innovista-backend
            pm2 save

            echo "🎉 Deployment successful!"