name: Deploy to EC2 Instances

on:
  push:
    branches:
      - Deployment_Product

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE_CONTENT
          script: |
            echo "🚀 Starting deployment..."

            # 1. Load NVM (Node)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 24 || echo "⚠️ NVM not found, using system node"

            # 2. Go to project directory
            cd ${{ secrets.EC2_PATH }} || { echo "❌ Path not found"; exit 1; }

            # 3. Pull latest code
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/Deployment_Product

            # 4. Go to backend
            cd back-end || { echo "❌ Backend folder missing"; exit 1; }

            # 5. Create .env file safely
            echo "🔐 Creating .env file..."
            echo "$ENV_FILE_CONTENT" > .env
            echo ".env file created"

            # 6. Wait for PostgreSQL to be ready
            echo " Waiting for PostgreSQL..."
            until pg_isready -h localhost -p 5432; do
              sleep 2
            done
            echo "✅ PostgreSQL is ready!"

            # 7. Backup database
            echo "💾 Taking DB backup..."
            pg_dump -U innovista_user InnovistaDB > "backup_$(date +%F_%H-%M-%S).sql" || echo "⚠️ Backup skipped"

            # 8. Install dependencies
            echo "📦 Installing dependencies..."
            npm install

            # 9. Prisma generate
            echo "⚙️ Generating Prisma client..."
            npx prisma generate

            # 10. Build project
            echo "🏗️ Building project..."
            npm run build

            # 11. SAFE migration (NO DATA LOSS)
            echo "🛠️ Running migrations..."
            npx prisma migrate deploy

            # 12. Seed (safe fallback)
            echo "🌱 Seeding database..."
            npx prisma db seed || echo "⚠️ Seed skipped"

            # 13. Restart app using PM2
            echo "🔄 Restarting application..."
            pm2 restart innovista-backend || pm2 start dist/src/main.js --name innovista-backend

            # 14. Save PM2 state
            pm2 save

            echo "✅ Deployment completed successfully!"
