name: Deploy to EC2 Instances

on:
  push:
    branches:
      - Deployment_Product

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE_CONTENT
          script: |
            # 0. Source NVM to load Node and NPM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 24 || echo "NVM use failed, proceeding with default path"
            
            # 1. Navigate to the project folder
            cd ${{ secrets.EC2_PATH }} || exit
            
            # 2. Pull the latest code from the correct branch
            git pull origin ${{ github.ref_name }}
            
            # 3. Enter the backend directory
            cd back-end
            
            # 4. Automate .env file creation (Safe & Zero-Issue)
            echo "$ENV_FILE_CONTENT" > .env
            
            # 5. Install dependencies and Build
            npm install
            npx prisma generate
            npm run build
            
            # 6. Safe Database Migration (Use 'migrate deploy' to protect your data)
            npx prisma migrate deploy
            
            # 7. Automated Admin Creation (Seeds the database)
            npx prisma db seed
            
            # 8. Restart the application with PM2
            pm2 restart innovista-backend || pm2 start dist/src/main.js --name innovista-backend
