name: Deploy Backend to EC2

on:
  push:
    branches:
      - Deployment_Product

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2

        uses: appleboy/ssh-action@v1.2.0

        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}

        with:
          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}

          envs: ENV_FILE_CONTENT

          script: |


            set -e



            echo "================================"

            echo "Starting Deployment"

            echo "================================"



            cd ${{ secrets.EC2_PATH }}



            echo "Pulling latest code"



            git fetch origin



            git checkout Deployment_Product



            git pull origin Deployment_Product



            echo "Creating environment file"
            
            printf "%s" "$ENV_FILE_CONTENT" > .env

            echo "Installing dependencies"

            npm ci --legacy-peer-deps

            echo "Generating Prisma Client"

            npx prisma generate

            echo "Running database migrations"

            npx prisma migrate deploy

            echo "Building NestJS"

            export NODE_OPTIONS=--max-old-space-size=2048

            npm run build

            echo "Checking build"

            if [ ! -f dist/src/main.js ] && [ ! -f dist/main.js ]

            then

              echo "Build failed"

              exit 1

            fi

            if [ -f dist/src/main.js ]

            then

              APP_FILE="dist/src/main.js"

            else

              APP_FILE="dist/main.js"

            fi

            echo "Starting application $APP_FILE"

            if pm2 describe innovista-backend > /dev/null

            then

                echo "Restarting PM2"

                pm2 restart innovista-backend

            else

                echo "Starting PM2"

                pm2 start $APP_FILE \
                --name innovista-backend

            fi
            pm2 save

            echo "================================"

            echo "Deployment Completed"

            echo "================================"
