name: Deploy NestJS to Hostinger VPS

on:
    push:
        branches:
            - Deployment_Product

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            # Checkout code
            - name: Checkout code
              uses: actions/checkout@v3

            # Set up Node.js (for local actions if needed)
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 22

            # SSH & Deploy to VPS
            - name: SSH & Deploy
              uses: appleboy/ssh-action@v0.1.6
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      # Ensure Node.js and npm are available
                      export NVM_DIR="$HOME/.nvm"
                      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

                      # Navigate to app
                      cd /var/www/nestjs-app || exit 1

                      # Pull latest code
                      git fetch --all
                      git reset --hard origin/Deployment_Product

                      # Install dependencies
                      npm install --legacy-peer-deps

                      # Build the project
                      npm run build

                      # Restart the app with PM2
                      pm2 restart nestjs-app || pm2 start dist/main.js --name nestjs-app